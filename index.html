*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;

}

.container{
  max-width:900px;

.header{

}

.cards{

}

.card{

  padding:16px;

}

.label{

}

.form{

  padding:15px;
  border-radius:15px;
  margin-top:20px;
  display:flex;
  gap:10px;
}

  padding:12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:15px;
}

#name{
  flex:1;
}

#fee{
  width:130px;
}

button{

  border-radius:10px;

  cursor:pointer;
}

.add{

  color:white;
}

.search{

  margin:18px 0 10px;
}
